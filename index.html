<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
        />
        <title>NoDOM DuckDB</title>
        <style>
            body {
                margin: 0;
                background-color: black;
            }
            /* FIXME: with our GLFW example this block seems to break resizing and io.DisplaySize gets stuck */
            .emscripten {
                position: absolute;
                top: 0px;
                left: 0px;
                margin: 0px;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;
                image-rendering: optimizeSpeed;
                image-rendering: -moz-crisp-edges;
                image-rendering: -o-crisp-edges;
                image-rendering: -webkit-optimize-contrast;
                image-rendering: optimize-contrast;
                image-rendering: crisp-edges;
                image-rendering: pixelated;
                -ms-interpolation-mode: nearest-neighbor;
            }
        </style>
    </head>
    <body>
        <canvas
            class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
        ></canvas>
        <script type="text/javascript">
            const init_layout = [
                {
                    "rname": "Home",
                    "cspec": {
                        "title": "UK Property Prices",
                        "title_font": "Arial"
                    },
                    "children": [
                        {
                            "rname": "PushFont",
                            "cspec": {
                                "font": "CourierNew"
                            }
                        },
                        {
                            "rname": "BeginChild",
                            "cspec": {
                                "title": "Main pane",
                                "child_flags": 5
                            }
                        },
                        {
                            "rname": "DatePicker",
                            "cspec": {
                                "cname": "start_date",
                                "year_month_font": "CourierNew",
                                "year_month_font_size": 12,
                                "day_date_font": "Arial",
                                "day_date_font_size": 8,
                                "table_flags": 0,
                                "combo_flags": 8
                            }
                        },
                        {
                            "rname": "SameLine"
                        },
                        {
                            "rname": "Text",
                            "cspec": {
                                "text": "start_date_text"
                            }
                        },
                        {
                            "rname": "DatePicker",
                            "cspec": {
                                "cname": "end_date",
                                "year_month_font": "CourierNew",
                                "year_month_font_size": 12,
                                "day_date_font": "Arial",
                                "day_date_font_size": 8,
                                "table_flags": 0,
                                "combo_flags": 8
                            }
                        },
                        {
                            "rname": "SameLine"
                        },
                        {   
                            "rname": "Text",
                            "cspec": {
                                "text": "end_date_text"
                            }
                        },
                        {
                            "rname": "Separator",
                            "cspec": {}
                        },
                        {
                            "rname": "Button",
                            "widget_id": "i_am_chart_button",
                            "cspec": {
                                "text": "chart_text",
                                "tooltip": "Raise the charting window"
                            }
                        },
                        {
                            "rname": "Footer",
                            "cspec": {
                                "db": true,
                                "fps": true,
                                "demo": true,
                                "font_scale": true,
                                "style": true,
                                "dlc": true
                            }
                        },
                        {
                            "rname": "Spacing",
                            "cspec": {}
                        },
                        {
                            "rname": "DebugFooter",
                            "cspec": {}
                        },
                        {
                            "rname": "Separator",
                            "cspec": {}
                        },
                        {
                            "rname": "BulkTable",
                            "cspec": {
                                "title": "Transactions",
                                "query_id": "select_all_prices",
                                "menupop": "table_rclick_menupop",
                                "table_flags": 50333543
                            }
                        },
                        {
                            "rname": "Separator",
                            "cspec": {}
                        },
                        {
                            "rname": "EndChild"
                        },
                        {
                            "rname": "PopFont"
                        }
                    ]
                },
                {
                    "widget_id": "parquet_loading_modal",
                    "rname": "LoadingModal",
                    "cspec": {
                        "title": "Loading parquet...",
                        "title_font": "Arial",
                        "body_font": "CourierNew",
                        "cname": "scan_urls",
                        "spinner_radius": 20,
                        "spinner_thickness": 4
                    }
                },
                {
                    "widget_id": "i_am_memory_editor",
                    "rname": "MemoryEditor",
                    "cspec": {
                        "text": "mem_edit_text",
                        "address": "mem_edit_addr",
                        "size": "mem_edit_size"
                    }
                },
                {
                    "widget_id": "i_am_chart_window",
                    "rname": "Window",
                    "cspec": {
                        "title": "Chart",
                        "title_font": "Arial",
                        "window_flags": 0,
                        "close_button": true
                    },
                    "children": [
                        {
                            "rname": "ShadedPlot",
                            "cspec": {
                                "title": "UK Property Transactions",
                                "show_lines": false,
                                "show_fills": false,
                                "show_scatter": false,
                                "xtime": true,
                                "iso_time": true,
                                "local_time": true,
                                "query_id": "select_all_prices",
                                "xname": "xaxis",
                                "xscaling": "xscale",
                                "yname": "yaxis"
                            },
                            "children": [
                                {
                                    "rname": "Curve",
                                    "cspec": {
                                        "show_lines": false,
                                        "show_fills": false,
                                        "show_scatter": true,
                                        "xtime": true,
                                        "iso_time": true,
                                        "local_time": true,
                                        "xname": "xaxis",
                                        "xscaling": "xscale",
                                        "yname": "yaxis",
                                        "title": "other",
                                        "query_id": "select_other_prices"
                                    }
                                },
                                {
                                    "rname": "Curve",
                                    "cspec": {
                                        "show_lines": false,
                                        "show_fills": false,
                                        "show_scatter": true,
                                        "xtime": true,
                                        "iso_time": true,
                                        "local_time": true,
                                        "xname": "xaxis",
                                        "xscaling": "xscale",
                                        "yname": "yaxis",
                                        "title": "flat",
                                        "query_id": "select_flat_prices"
                                    }
                                },
                                {
                                    "rname": "Curve",
                                    "cspec": {
                                        "show_lines": false,
                                        "show_fills": false,
                                        "show_scatter": true,
                                        "xtime": true,
                                        "iso_time": true,
                                        "local_time": true,
                                        "xname": "xaxis",
                                        "xscaling": "xscale",
                                        "yname": "yaxis",
                                        "title": "detached",
                                        "query_id": "select_detached_prices"
                                        }
                                },
                                {
                                    "rname": "Curve",
                                    "cspec": {
                                        "show_lines": false,
                                        "show_fills": false,
                                        "show_scatter": true,
                                        "xtime": true,
                                        "iso_time": true,
                                        "local_time": true,
                                        "xname": "xaxis",
                                        "xscaling": "xscale",
                                        "yname": "yaxis",
                                        "title": "semi",
                                       "query_id": "select_semi_prices"
                                    }
                                },
                                {
                                    "rname": "Curve",
                                    "cspec": {
                                        "show_lines": false,
                                        "show_fills": false,
                                        "show_scatter": true,
                                        "xtime": true,
                                        "iso_time": true,
                                        "local_time": true,
                                        "xname": "xaxis",
                                        "xscaling": "xscale",
                                        "yname": "yaxis",
                                        "title": "terrace",
                                        "query_id": "select_terrace_prices"
                                    }
                                },
                                {
                                    "rname": "PlotHover",
                                    "cspec": {
                                        "title": "property_hover_tip",
                                        "buffer_size": 256
                                    }
                                }
                            ]
                        }
                    ]
                }
            ];
            const init_data = {
                "start_date": [2020,1,1],
                "end_date": [2023,2,28],
                "start_date_text": "Start date",
                "end_date_text": "End date",
                "chart_text": "Chart",
                "scan_urls": [
                    "s3://datasets-documentation/uk-house-prices/parquet"
                ],
                "httpfs_sql": "INSTALL httpfs; LOAD httpfs;",
                "table_sql": "BEGIN; CREATE TABLE IF NOT EXISTS prices AS\n SELECT price, date, postcode1, postcode2, type, is_new, duration, addr1, addr2\n FROM read_csv_auto('https://datasets-documentation.s3.eu-west-3.amazonaws.com/uk-house-prices/csv/house_prices.csv.gz', types={'price': 'DOUBLE', 'date': 'DOUBLE', 'type': 'INTEGER', 'is_new': 'INTEGER', 'duration': 'INTEGER'})\n WHERE COLUMNS('[price|date|postcode?|addr?]') IS NOT NULL\n AND DATE > 1.0; COMMIT;",
                "select_all_sql": "select * from prices order by date asc,price asc;",
                "enable_logging_sql": "INSTALL parquet; CALL enable_logging(level='debug', storage='stdout');",
                "prices_storage_sql": "PRAGMA storage_info('prices');",
                "memory_limit_sql": "SELECT current_setting('memory_limit');",
                "mem_edit_addr": 0,
                "mem_edit_size": 0,
                "mem_edit_text": "Memory Editor",
                "xaxis": "date",
                "xscale": 86400.0,
                "yaxis": "price",
                "actions": {
                    "i_am_chart_button.Click": [
                        {
                            "ui_push": "i_am_chart_window"
                        }
                    ],
                    "DuckDB.Online": [
                        {
                            "action": "Command",
                            "query_id": "load_and_install_httpfs",
                            "cname": "httpfs_sql"
                        },
                        {
                            "ui_push": "parquet_loading_modal",
                            "action": "Command",
                            "query_id": "create_prices_table",
                            "cname": "table_sql"
                        },
                        {
                            "action": "Query",
                            "query_id": "select_all_prices",
                            "cname": "select_all_sql"
                        },
                        {
                            "action": "BatchRequest",
                            "query_id": "select_all_prices"
                        },
                        {
                            "action": "Query",
                            "query_id": "select_other_prices",
                            "cname": "select_other_prices_sql"
                        },
                        {
                            "action": "BatchRequest",
                            "query_id": "select_other_prices"
                        },
                        {
                            "action": "Query",
                            "query_id": "select_flat_prices",
                            "cname": "select_flat_prices_sql"
                        },
                        {
                            "action": "BatchRequest",
                            "query_id": "select_flat_prices"
                        },
                        {
                            "action": "Query",
                            "query_id": "select_detached_prices",
                            "cname": "select_detached_prices_sql"
                        },
                        {
                            "action": "BatchRequest",
                            "query_id": "select_detached_prices"
                        },
                        {
                            "action": "Query",
                            "query_id": "select_semi_prices",
                            "cname": "select_semi_prices_sql"
                        },
                        {
                            "action": "BatchRequest",
                            "query_id": "select_semi_prices"
                        },
                        {
                            "action": "Query",
                            "query_id": "select_terrace_prices",
                            "cname": "select_terrace_prices_sql"
                        },
                        {
                            "action": "BatchRequest",
                            "query_id": "select_terrace_prices"
                        },
                        {
                            "ui_pop": "LoadingModal"
                        }
                    ],
                    "Memory Editor.Menu": [
                        {
                            "ui_push": "i_am_memory_editor"
                        }
                    ]
                },
                "menus": {
                    "table_rclick_menupop": [
                        "Memory Editor"
                    ]
                },
                "types": {
                    "cdPtr": [
                        "mem_edit_addr"
                    ],
                    "cdInt": [
                        "mem_edit_size"
                    ],
                    "cdStr": [
                        "mem_edit_text"
                    ]
                },
                "select_other_prices_sql": "select date,price from prices where type=5;",
                "select_flat_prices_sql": "select date,price from prices where type=4;",
                "select_detached_prices_sql": "select date,price from prices where type=3;",
                "select_semi_prices_sql": "select date,price from prices where type=2;",
                "select_terrace_prices_sql": "select date,price from prices where type=1;"
            };
            const nd_config = {
                fonts: ["CourierNew.ttf", "Arial.ttf"],
                no_websock: true,
                imlog: false
            };
            var Module = {
                arguments: [
                    "ukp",
                    JSON.stringify(init_data),
                    JSON.stringify(init_layout),
                    JSON.stringify(nd_config),
                ],
                preRun: [],
                postRun: [],
                print: (function () {
                    return function (text) {
                        text = Array.prototype.slice.call(arguments).join(" ");
                        console.log(text);
                    };
                })(),
                printErr: function (text) {
                    text = Array.prototype.slice.call(arguments).join(" ");
                    console.error(text);
                },
                canvas: (function () {
                    var canvas = document.getElementById("canvas");
                    //canvas.addEventListener("webglcontextlost", function(e) { alert('FIXME: WebGL context lost, please reload the page'); e.preventDefault(); }, false);
                    return canvas;
                })(),
                setStatus: function (text) {
                    console.log("status: " + text);
                },
                monitorRunDependencies: function (left) {
                    // no run dependencies to log
                },
            };
            window.onerror = function () {
                console.log("onerror: " + event);
            };
        </script>
        <script async type="text/javascript" src="nodom_duck.js"></script>
        <script type="module" src="./duck_module.js" defer></script>
    </body>
</html>
